<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Film Digitizer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="container">
        <header class="app-header">
            <div>
                <h1>Film Digitizer</h1>
                <p class="subhead">One-click scan on Pi, processing on PC.</p>
            </div>
            <div class="sys-status">
                <div class="sys-indicator">
                    <span class="sys-dot" id="piScannerDot"></span>
                    <span id="piScannerLabel" class="sys-label">Pi Scanner</span>
                </div>
            </div>
        </header>

        <section class="job-shell">
            <div class="job-actions">
                <button id="scanBtn" class="primary scan-btn">One-Click Scan</button>
                <button id="cancelBtn" class="secondary" disabled>Cancel</button>
            </div>
            <div id="jobStatusText" class="job-status-text">
                Idle. Press One-Click Scan to start.
            </div>
        </section>

        <section id="progressSection" class="progress-section hidden">
            <div class="progress-header">
                <span id="stageLabel" class="stage-label">Dispatching job to Pi</span>
                <span id="progressPct" class="progress-pct-label">0%</span>
            </div>
            <div class="progress-track unified-track">
                <div id="unifiedBar" class="progress-bar unified-bar" style="width: 0%"></div>
            </div>
            <div class="stage-steps" id="stageSteps"></div>
        </section>

        <section id="resultsSection" class="results hidden">
            <div id="classificationBanner" class="clf-banner hidden">
                <span class="clf-label">Film type</span>
                <span id="clfTypeChip" class="clf-type-chip unknown"></span>
                <span id="clfRawLabel" class="clf-raw-label"></span>
                <span id="clfModeText" class="clf-mode-text"></span>
            </div>
            <div class="compare-grid">
                <article class="image-card">
                    <div class="card-title-row">
                        <h2>Raw Tiles</h2>
                        <span id="rawTileCount" class="tile-badge"></span>
                    </div>
                    <div id="rawGridPlaceholder" class="img-placeholder">Waiting for scan to start.</div>
                    <div id="rawTileGrid" class="tile-grid hidden"></div>
                </article>
                <article class="image-card">
                    <div class="card-title-row">
                        <h2>Processed</h2>
                        <span id="procTileCount" class="tile-badge"></span>
                    </div>
                    <div id="procGridPlaceholder" class="img-placeholder">Waiting for processing.</div>
                    <div id="procTileGrid" class="tile-grid hidden"></div>
                    <img id="finalImg" class="result-img hidden" alt="Final integrated image" />
                </article>
            </div>
        </section>
    </main>
    <script src="app.js?v=5"></script>
</body>
</html>
