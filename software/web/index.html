<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Digitizer Control</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="container">
        <h1>Film Digitizer Control</h1>
        <section class="controls">
            <div class="controls-row">
                <label for="format">Film Format:</label>
                <select id="format">
                    <option value="35mm">35mm</option>
                    <option value="120">120</option>
                    <option value="instax">Instax</option>
                </select>
            </div>
            <div class="controls-row">
                <button id="start" class="primary">Start Scan</button>
                <button id="cancel" class="secondary">Cancel</button>
            </div>
        </section>
        <section class="controls">
            <div class="controls-row">
                <label for="serialPortSelect">Serial Port:</label>
                <select id="serialPortSelect">
                    <option value="">Select Port</option>
                </select>
            </div>
        </section>
        <section class="status">
            <h2>Status</h2>
            <div id="stateBadge" class="badge idle">Idle</div>
            <div id="resultArea"></div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
