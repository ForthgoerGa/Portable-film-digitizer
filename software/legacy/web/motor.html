<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motor Control - Film Digitizer</title>
    <link rel="stylesheet" href="/web/style.css" />
</head>
<body>
    <main class="container">
        <header>
            <h1>Motor Control Panel</h1>
            <a href="/" class="back-link">← Back to Main</a>
        </header>

        <section class="motor-controls">
            <h2>Jog Controls (Continuous Movement)</h2>
            <div class="motor-grid">
                <div class="axis-control">
                    <h3>X-Axis (Horizontal)</h3>
                    <div class="button-row">
                        <button id="jogXForward" class="motor-btn">Forward</button>
                        <button id="jogXReverse" class="motor-btn">Reverse</button>
                    </div>
                </div>
                <div class="axis-control">
                    <h3>Y-Axis (Vertical)</h3>
                    <div class="button-row">
                        <button id="jogYForward" class="motor-btn">Forward</button>
                        <button id="jogYReverse" class="motor-btn">Reverse</button>
                    </div>
                </div>
            </div>
            <div class="controls-row">
                <button id="stopAll" class="secondary">Stop All</button>
            </div>
        </section>

        <section class="motor-controls">
            <h2>Step Movement (Precise Positioning)</h2>
            <div class="motor-grid">
                <div class="axis-control">
                    <h3>X-Axis (Horizontal)</h3>
                    <div class="button-row">
                        <button id="jogXForward" class="motor-btn">Forward</button>
                        <button id="jogXReverse" class="motor-btn">Reverse</button>
                    </div>
                    <div class="step-control">
                        <label for="xSteps">Steps:</label>
                        <input type="number" id="xSteps" value="100" min="-10000" max="10000">
                        <button id="moveX" class="motor-btn">Move</button>
                    </div>
                </div>
                <div class="axis-control">
                    <h3>Y-Axis (Vertical)</h3>
                    <div class="button-row">
                        <button id="jogYForward" class="motor-btn">Forward</button>
                        <button id="jogYReverse" class="motor-btn">Reverse</button>
                    </div>
                    <div class="step-control">
                        <label for="ySteps">Steps:</label>
                        <input type="number" id="ySteps" value="100" min="-10000" max="10000">
                        <button id="moveY" class="motor-btn">Move</button>
                    </div>
                </div>
            </div>
            <div class="controls-row">
                <button id="moveBoth" class="primary">Move Both Axes</button>
            </div>
        </section>

        <section class="status">
            <h2>Control Status</h2>
            <div id="motorStatus" class="status-display">Ready</div>
        </section>

        <section class="motor-controls">
            <h2>🎯 Step Movement (Precise Positioning)</h2>
            <div class="motor-grid">
                <div class="axis-control">
                    <h3>X-Axis</h3>
                    <div class="step-control">
                        <label for="xSteps">Steps:</label>
                        <input type="number" id="xSteps" value="100" min="-10000" max="10000">
                        <button id="moveX" class="motor-btn">Move</button>
                    </div>
                </div>
                <div class="axis-control">
                    <h3>Y-Axis</h3>
                    <div class="step-control">
                        <label for="ySteps">Steps:</label>
                        <input type="number" id="ySteps" value="100" min="-10000" max="10000">
                        <button id="moveY" class="motor-btn">Move</button>
                    </div>
                </div>
            </div>
            <div class="controls-row">
                <button id="moveBoth" class="primary">🎯 Move Both Axes</button>
            </div>
        </section>

        <section class="status">
            <h2>📊 Control Status</h2>
            <div id="motorStatus" class="status-display">Ready</div>
        </section>
    </main>
    <script src="/web/motor.js"></script>
</body>
</html>
