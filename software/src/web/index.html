<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Digitizer Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Film Digitizer Scanner</h1>
            <div class="motor-status-bar" aria-label="Motor status">
                <div class="motor-status-row">
                    <span class="motor-axis">X</span>
                    <span id="motorXState" class="motor-state status-reset">RESET</span>
                    <span id="motorXPosition" class="motor-position">0</span>
                </div>
                <div class="motor-status-row">
                    <span class="motor-axis">Y</span>
                    <span id="motorYState" class="motor-state status-reset">RESET</span>
                    <span id="motorYPosition" class="motor-position">0</span>
                </div>
            </div>
        </header>

        <main>
            <!-- Scan Control Section -->
            <section class="scan-control">
                <h2>Scan Control</h2>

                <div class="control-group">
                    <label for="filmFormat">Film Format:</label>
                    <select id="filmFormat">
                        <option value="35mm">35mm</option>
                        <option value="120">120 (Medium Format)</option>
                        <option value="4x5">4x5 (Large Format)</option>
                    </select>
                </div>

                <div class="control-group">
                    <button id="startScanBtn" class="btn btn-primary">Start Scan</button>
                    <button id="cancelScanBtn" class="btn btn-danger">Cancel Scan</button>
                </div>

                <div class="status-display">
                    <div class="status-item">
                        <span class="label">Status:</span>
                        <span id="scanStatus" class="value status-idle">Ready</span>
                    </div>
                    <div class="status-item">
                        <span class="label">Progress:</span>
                        <span id="scanProgress" class="value">0%</span>
                    </div>
                    <div class="status-item">
                        <span class="label">Grid Position:</span>
                        <span id="scanPosition" class="value">0, 0</span>
                    </div>
                </div>

                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </section>

            <!-- Captures Viewer Section -->
            <section class="captures-viewer">
                <h2>Captured Images</h2>
                <div class="captures-controls">
                    <button id="refreshCapturesBtn" class="btn btn-secondary">Refresh</button>
                </div>
                <div class="captures-container">
                    <div class="captures-sidebar">
                        <ul id="captures-tree"></ul>
                    </div>
                    <div class="captures-content">
                        <div id="captures-path">No image selected</div>
                        <div class="image-container">
                            <img id="capture-image" alt="Selected capture" style="display: none;">
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
